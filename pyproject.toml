[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tock-lid"
version = "0.1.0"
description = "Generate multi-colour SVG and STL lettering for the lid of a Tock / Keezen box."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fonttools>=4.50",
    "uharfbuzz>=0.39",
    "skia-pathops>=0.8",
    "shapely>=2.0",
    "trimesh>=4.0",
    "mapbox-earcut>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
tock-lid = "tock_lid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tock_lid = ["fonts/*/*.ttf", "fonts/*/OFL.txt"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90", "N", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-statements = 25

[tool.pytest.ini_options]
testpaths = ["tests"]
